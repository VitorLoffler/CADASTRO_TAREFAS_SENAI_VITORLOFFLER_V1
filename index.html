<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel de tarefas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

   <div class="cartao-aplicacao">
    <header class="cabecalho-aplicacao">
        <h1>Minhas Tarefas</h1>
        <button id="botao-tema" class="botao-icone">
            <i class="fa-solid fa-moon"></i>
        </button>
    </header>

    <div class="caixa-entrada">
        <input type="text" id="campo-tarefa" placeholder="O que vamos fazer hoje?..." maxlength="40">
        <button id="botao-adicionar" class="botao-principal"> 
            <i class="fa-solid fa-plus"></i> Adicionar</button>
    </div>

    <ul id="lista-tarefas" class="lista-tarefas">
        <!-- As tarefas serão inseridas aqui dinamicamente via js -->
    </ul>
        <span id="contador-tarefas" class="rodape-aplicacao">0 Tarefas na lista</span>
    <footer>
        <h4>Este Programa foi Desenvolvido por: Vitor Marcelo Loffler </h4>
        <img src="fotoMinha.jpg" alt="">
    </footer>
    
   </div>
   <script src="script.js"></script>
</body>
</html>
